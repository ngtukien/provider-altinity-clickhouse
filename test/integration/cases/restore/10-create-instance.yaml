apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: itest-ch-restore
  namespace: default
spec:
  providerRef:
    name: altinity-clickhouse
  topology:
    type: standalone
  components:
    engine:
      type: clickhouse
      replicas: 1
      resources:
        # The lab has 6 worker CPUs; with requests equal to limits the later scenarios leave a shard Pending.
        requests:
          cpu: 250m
        limits:
          cpu: "1"
          memory: 2G
      storage:
        size: 10Gi
  backup:
    enabled: true
    classRef:
      name: altinity-clickhouse-backup
    storages:
      - storageRef:
          name: itest-ch-restore-backup-storage
        schedules:
          - name: hourly
            enabled: true
            cron: "* * * * *"
