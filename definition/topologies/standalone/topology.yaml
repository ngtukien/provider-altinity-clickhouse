# Standalone topology: single-node ClickHouse instance.
# No replication, no ZooKeeper/Keeper required.
# Suitable for development, analytics workloads, and non-HA production.

config:
  components:
    engine: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the ClickHouse version to deploy."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "ClickHouse Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            helperText: "Upgrades are applied as a rolling restart. Downgrades are rejected."
          validation:
            required: true

    resources:
      label: "Resources"
      description: "Configure compute resources and storage for the ClickHouse instance."
      components:
        compute:
          uiType: group
          groupType: line
          components:
            cpu:
              uiType: number
              path: spec.components.engine.resources.limits.cpu
              fieldParams:
                label: "CPU"
                defaultValue: 1
                step: 1
              validation:
                required: true
                min: 1
            memory:
              uiType: number
              path: spec.components.engine.resources.limits.memory
              fieldParams:
                label: "Memory"
                defaultValue: 4
                step: 1
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                min: 1
            disk:
              uiType: number
              path: spec.components.engine.storage.size
              fieldParams:
                label: "Disk"
                defaultValue: 25
                badge: "Gi"
                badgeToApi: true
              validation:
                required: true
                int: true
                min: 1
                modes:
                  edit:
                    celExpressions:
                      - celExpr: "spec.components.engine.storage.size >= original.spec.components.engine.storage.size"
                        message: "Disk size cannot be decreased"
          componentsOrder:
            - cpu
            - memory
            - disk

    # dbaas: form cho khách giữ version, tài nguyên, TLS và mạng. Monitoring, StorageClass, chính sách giữ dữ
    # liệu và config tự do là việc của platform: bỏ khỏi form, provider dùng mặc định
    # (không PodMonitor, StorageClass mặc định, Retain, không config thêm).
    security:
      label: "Security"
      description: "Encrypt client connections."
      components:
        tls:
          uiType: select
          path: spec.components.engine.parameters.tls.enabled
          fieldParams:
            label: "TLS"
            helperText: "Clients connect over HTTPS (8443) and native TLS (9440) only."
            defaultValue: "disabled"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Enabled"
                value: "enabled"
      componentsOrder:
        - tls

    # dbaas: mạng do khách chọn (network.*): chuỗi, danh sách cách nhau bằng dấu phẩy vì form không nhập được mảng.
    network:
      label: "Network"
      description: "Choose the client protocols and who may connect."
      components:
        protocols:
          uiType: select
          path: spec.components.engine.parameters.network.protocols
          fieldParams:
            label: "Protocols"
            helperText: "HTTP is 8123 (8443 with TLS), native is 9000 (9440 with TLS)."
            defaultValue: "all"
            options:
              - label: "HTTP and native"
                value: "all"
              - label: "HTTP only"
                value: "http"
              - label: "Native only"
                value: "native"
        serviceType:
          uiType: select
          path: spec.components.engine.service.serviceType
          fieldParams:
            label: "Exposure"
            helperText: "NodePort: reachable from outside the cluster on <node IP>:<node port> (see the connection details). ClusterIP: in-cluster only. Fixed after creation."
            defaultValue: "NodePort"
            options:
              - label: "NodePort (outside the cluster)"
                value: "NodePort"
              - label: "ClusterIP (in-cluster only)"
                value: "ClusterIP"
            modes:
              edit:
                disabled: true
        namespaces:
          uiType: text
          path: spec.components.engine.parameters.network.allowedSources.namespaces
          fieldParams:
            label: "Allowed namespaces"
            placeholder: "app, bi"
            helperText: "Comma-separated. Empty with no CIDRs: anyone may connect; otherwise only these and this namespace. Ignored with NodePort."
        cidrs:
          uiType: text
          path: spec.components.engine.parameters.network.allowedSources.cidrs
          fieldParams:
            label: "Allowed CIDRs"
            placeholder: "10.0.5.0/24"
            helperText: "Comma-separated IP ranges."
      componentsOrder:
        - serviceType
        - protocols
        - namespaces
        - cidrs

  sectionsOrder:
    - databaseVersion
    - resources
    - security
    - network
