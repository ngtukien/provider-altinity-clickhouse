# UI rendering hints for the altinity-clickhouse-backup BackupClass.

backup:
    label: Backup Configuration
    components:
        replicaSelection:
            path: replicaSelection
            uiType: select
            fieldParams:
                label: Replica selection
                defaultValue: FirstPerShard
                options:
                    - label: First per shard
                      value: FirstPerShard
                    - label: All replicas
                      value: AllReplicas
    componentsOrder:
        - replicaSelection

restore:
    label: Restore Configuration
    components:
        overwrite:
            path: overwrite
            uiType: toggle
            fieldParams:
                label: Overwrite existing tables
                defaultValue: false
                helperText: Drop existing tables before restoring. When false (default), the restore is refused if any target host already holds user tables.
        schemaOnly:
            path: schemaOnly
            uiType: toggle
            fieldParams:
                label: Schema only
                defaultValue: false
                helperText: Restore schema and table definitions only, skipping table data.
        tables:
            path: tables
            uiType: text
            fieldParams:
                label: Tables
                helperText: Restrict restore to matching table patterns (e.g. "db.table", "db.*"). Empty restores all tables.
    componentsOrder:
        - overwrite
        - schemaOnly
        - tables
