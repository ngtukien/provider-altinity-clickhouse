apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: {{ .Values.provider.name }}
  labels:
    {{- include "provider-altinity-clickhouse.labels" . | nindent 4 }}
# Spec is generated by `provider-sdk generate` from definition/ files.
# Run `make generate` to update.
{{- if .Values.loadBalancer.enabled }}
{{- /* The platform has a load balancer: offer it in every topology's Network section. */}}
{{- $spec := .Files.Get "generated/provider-spec.yaml" | fromYaml }}
{{- range $topology, $ui := $spec.spec.uiSchema }}
{{- with $ui.sections.network }}
{{- $exposure := .components.serviceType.fieldParams }}
{{- $_ := set $exposure "options" (append $exposure.options (dict "label" "LoadBalancer (own IP, standard ports)" "value" "LoadBalancer")) }}
{{- $_ := set $exposure "helperText" "LoadBalancer: its own address on the standard ports, limited to the allowed IPs. NodePort: reachable from outside the cluster by name (HTTPS 443, native TLS 9440) or on <node IP>:<node port>. ClusterIP: in-cluster only. Fixed after creation." }}
{{- $_ := set .components "loadBalancerSourceRanges" (dict "uiType" "text" "path" "spec.components.engine.parameters.loadBalancerSourceRanges" "fieldParams" (dict "label" "Allowed IPs" "placeholder" "203.0.113.0/24, 198.51.100.7/32" "helperText" "LoadBalancer only: comma-separated CIDRs allowed to connect. Empty: anyone.")) }}
{{- $_ := set . "componentsOrder" (append .componentsOrder "loadBalancerSourceRanges") }}
{{- end }}
{{- end }}
{{ toYaml $spec }}
{{- else }}
{{ .Files.Get "generated/provider-spec.yaml" | nindent 0 }}
{{- end }}
