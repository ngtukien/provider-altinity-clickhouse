apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: {{ .Values.provider.name }}
  labels:
    {{- include "provider-altinity-clickhouse.labels" . | nindent 4 }}
# Spec is generated by `provider-sdk generate` from definition/ files.
# Run `make generate` to update.
{{- $spec := .Files.Get "generated/provider-spec.yaml" | fromYaml }}
{{- $lb := .Values.loadBalancer.enabled }}
{{- $connectivity := .Values.form.connectivity }}
{{- if or $lb $connectivity }}
{{- range $topology, $ui := $spec.spec.uiSchema }}
{{- if $connectivity }}
{{- /* One Connectivity choice instead of Security + Network; TLS and the external ports come from defaults.*. */}}
{{- $_ := unset $ui.sections "security" }}
{{- $_ := set $ui "sectionsOrder" (without $ui.sectionsOrder "security") }}
{{- with $ui.sections.network }}
{{- $_ := set . "label" "Connectivity" }}
{{- $_ := set . "description" "Internal: reachable in the cluster only. External: also from outside, over TLS only." }}
{{- $exposure := .components.serviceType.fieldParams }}
{{- $_ := set $exposure "label" "Connectivity" }}
{{- $_ := set $exposure "defaultValue" "ClusterIP" }}
{{- $_ := set $exposure "options" (list (dict "label" "Internal (in-cluster, plain or TLS)" "value" "ClusterIP") (dict "label" "External (outside the cluster, TLS only)" "value" (ternary "LoadBalancer" "NodePort" $lb))) }}
{{- $_ := set $exposure "helperText" (ternary "External: its own address, HTTPS 8443 and native TLS 9440, limited to the allowed IPs. Fixed after creation." "External: by name (HTTPS 443, native TLS 9440) or on <node IP>:<node port> for 8443/9440; see the connection details. Fixed after creation." $lb) }}
{{- if $lb }}
{{- $_ := set .components "loadBalancerSourceRanges" (dict "uiType" "text" "path" "spec.components.engine.parameters.loadBalancerSourceRanges" "fieldParams" (dict "label" "Allowed IPs" "defaultValue" "0.0.0.0/0" "placeholder" "203.0.113.0/24, 198.51.100.7/32" "helperText" "External only: comma-separated CIDRs allowed to connect.")) }}
{{- $_ := set . "componentsOrder" (append .componentsOrder "loadBalancerSourceRanges") }}
{{- end }}
{{- end }}
{{- else }}
{{- /* The platform has a load balancer: offer it in every topology's Network section. */}}
{{- with $ui.sections.network }}
{{- $exposure := .components.serviceType.fieldParams }}
{{- $_ := set $exposure "options" (append $exposure.options (dict "label" "LoadBalancer (own IP, standard ports)" "value" "LoadBalancer")) }}
{{- $_ := set $exposure "helperText" "LoadBalancer: its own address on the standard ports, limited to the allowed IPs. NodePort: reachable from outside the cluster by name (HTTPS 443, native TLS 9440) or on <node IP>:<node port>. ClusterIP: in-cluster only. Fixed after creation." }}
{{- $_ := set .components "loadBalancerSourceRanges" (dict "uiType" "text" "path" "spec.components.engine.parameters.loadBalancerSourceRanges" "fieldParams" (dict "label" "Allowed IPs" "placeholder" "203.0.113.0/24, 198.51.100.7/32" "helperText" "LoadBalancer only: comma-separated CIDRs allowed to connect. Empty: anyone.")) }}
{{- $_ := set . "componentsOrder" (append .componentsOrder "loadBalancerSourceRanges") }}
{{- end }}
{{- end }}
{{- end }}
{{ toYaml $spec }}
{{- else }}
{{ .Files.Get "generated/provider-spec.yaml" | nindent 0 }}
{{- end }}
