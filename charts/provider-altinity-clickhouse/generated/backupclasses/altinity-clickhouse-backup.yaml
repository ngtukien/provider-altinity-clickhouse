apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: altinity-clickhouse-backup
spec:
  description: ClickHouse backups via the Altinity operator's clickhouse-backup sidecar to S3-compatible storage.
  displayName: ClickHouse Backup (clickhouse-backup)
  executionMode: ProviderManaged
  parametersSchema:
    openAPIV3Schema:
      description: |-
        AltinityClickhouseBackupConfig is validated against Backup.spec.parameters and
        per-schedule parameters.
      properties:
        replicaSelection:
          description: |-
            ReplicaSelection picks which replicas are backed up. FirstPerShard (default) backs up
            one replica of each shard, which is complete only for Replicated* tables. AllReplicas
            is needed when the cluster holds non-replicated tables.
          enum:
            - FirstPerShard
            - AllReplicas
          type: string
      type: object
  providerManaged:
    limits:
      maxPITREnabledStorages: 0
      maxStorages: 1
    supportsPITR: false
  restoreParametersSchema:
    openAPIV3Schema:
      description: AltinityClickhouseRestoreConfig is validated against Restore.spec.parameters.
      properties:
        overwrite:
          description: |-
            Overwrite allows restoring over existing tables, which are dropped first.
            When false (default), the restore is refused if any target host already holds user tables.
          type: boolean
        schemaOnly:
          description: SchemaOnly restores table and database definitions only, skipping table data.
          type: boolean
        tables:
          description: |-
            Tables optionally restricts the restore to comma-separated table names or patterns
            (e.g. "db.table", "db.*") matching the clickhouse-backup syntax. Empty restores everything.
          type: string
      type: object
  supportedProviders:
    - altinity-clickhouse
  supportsImport: true
  uiSchema:
    backup:
      components:
        replicaSelection:
          fieldParams:
            defaultValue: FirstPerShard
            label: Replica selection
            options:
              - label: First per shard
                value: FirstPerShard
              - label: All replicas
                value: AllReplicas
          path: replicaSelection
          uiType: select
      componentsOrder:
        - replicaSelection
      label: Backup Configuration
    restore:
      components:
        overwrite:
          fieldParams:
            defaultValue: false
            helperText: Drop existing tables before restoring. When false (default), the restore is refused if any target host already holds user tables.
            label: Overwrite existing tables
          path: overwrite
          uiType: toggle
        schemaOnly:
          fieldParams:
            defaultValue: false
            helperText: Restore schema and table definitions only, skipping table data.
            label: Schema only
          path: schemaOnly
          uiType: toggle
        tables:
          fieldParams:
            helperText: Restrict restore to matching table patterns (e.g. "db.table", "db.*"). Empty restores all tables.
            label: Tables
          path: tables
          uiType: text
      componentsOrder:
        - overwrite
        - schemaOnly
        - tables
      label: Restore Configuration
